    en: {

      t20: 'You played 20 minutes', keepQ: 'Want to keep going?', keep: 'Keep going', enough: "That's enough today", bye: 'See you later', today: "Today's score",
      saved: 'Your game is saved here until you come back.', ok: 'OK', other: 'ع',
      paused: 'Paused ⏸', resume: 'Resume ▶', resetQ: 'Start over?', resetNote: 'This round will be cleared. Your best score stays.', resetYes: 'Yes, start over', resetNo: 'No, keep playing', pauseT: 'Pause', resetT: 'Start over',
      themes: ['Garden 🌷', 'Sea 🐠', 'Desert 🐪', 'Space 🚀', 'Sweets 🍭', 'Forest 🌳', 'Snow ❄️', 'Rainbow 🌈', 'Farm 🐄', 'Moon 🌙', 'Fruits 🍉', 'Dinosaurs 🦖'],
      praise: {},
      levelUp: 'Level ',
      rules: [
        'Drag any of the three pieces onto the board.',
        'When a row or a column is full, it clears.',

        'Clear move after move and your points multiply by the combo (×2, ×3…). Three pieces in a row without a clear resets the combo.',
        'When you clear lines the computer cheers: Nice (1 line) · Good (2, +20) · Very good (3, +50) · Excellent (4 or more, +100) · Amazing when the board is completely empty (+300).',
        'Levels: the first level has small, easy pieces. Clearing lines moves you up a level and bigger shapes join in. Every new game starts at level 1.',
        'Every level has its own world and colors: Garden, Sea, Desert, Space, Sweets, Forest, Snow, Rainbow, Farm, Moon, Fruits, Dinosaurs.',

    }
  };
  var lang = (function () { try { var v = localStorage.getItem('rass.lang'); if (v) return v; } catch (e) {} return (navigator.language || 'ar').slice(0, 2) === 'ar' ? 'ar' : 'en'; })();
  function tr(k) { return T[lang][k]; }
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = tr('name');
    document.querySelectorAll('[data-i]').forEach(function (el) { el.textContent = tr(el.getAttribute('data-i')); });
    document.getElementById('howList').innerHTML = '';

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var best = parseInt(store('rass.best') || '0', 10) || 0;
  var state;

  function save() {
    try { store('rass.game', JSON.stringify({ board: state.board, tray: state.tray, score: state.score, combo: state.combo, noClear: state.noClear, undoUsed: state.undoUsed, lines: state.lines, level: state.level })); } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(store('rass.game'));
      if (!s || !s.board || s.board.length !== N * N) return null;
      var g = L.newGame(Math.random);
      g.board = s.board; g.tray = s.tray; g.score = s.score; g.combo = s.combo; g.noClear = s.noClear; g.undoUsed = !!s.undoUsed; g.lines = s.lines || 0; g.level = s.level || 1;
      g.over = L.isOver(g);

    } catch (e) { return null; }
  }
  function newGame() { state = L.newGame(Math.random); save(); render(); }

  function render(ghost) {
    for (var i = 0; i < N * N; i++) {
      var v = state.board[i];
      cells[i].className = 'cell' + (v ? ' filled f' + v : '');
    }
    if (ghost) ghost.forEach(function (k) { cells[k].className = 'cell ghost'; });
    $('score').textContent = state.score;
    $('best').textContent = best;
    applyTheme(state.level);
    $('lvl').textContent = tr('level') + ' ' + state.level + ' · ' + themeName(state.level);
    var at = [0, 3, 8, 15], lv = state.level, lo = lv <= 3 ? at[lv - 1] : 15 + (lv - 4) * 10, hi = lv <= 3 ? at[lv] : lo + 10;

    $('undo').title = state.undoUsed ? tr('undoUsed') : tr('undo');

  function buildPiece(el, piece, size, gap) {
    var h = 0, w = 0;
    piece.cells.forEach(function (c) { h = Math.max(h, c[0] + 1); w = Math.max(w, c[1] + 1); });

    var map = {};

    for (var r = 0; r < h; r++) for (var c = 0; c < w; c++) {

      b.className = map[r * 10 + c] ? 'b' : 'e';

      var el = document.createElement('div');
      el.className = 'mini' + (L.fitsAnywhere(state.board, p.cells) ? '' : ' no-fit');
      buildPiece(el, p, mini, 2);
      slots[t].appendChild(el);
    }
  }

  // السحب
  var drag = null;
  for (var si = 0; si < 3; si++) (function (t) { slots[t].addEventListener('pointerdown', function (e) { startDrag(e, t); }); })(si);
  function startDrag(e, idx) {
    var piece = state.tray[idx];
    if (state.over || !piece || drag) return;
    e.preventDefault();
    sfx.unlock();
    var size = cellSize();
    var el = document.createElement('div');
    el.id = 'drag';
    var dims = buildPiece(el, piece, size, 3);
    document.body.appendChild(el);
    hideSlot(idx);
    drag = { idx: idx, piece: piece, el: el, size: size, dims: dims,
             lift: e.pointerType === 'mouse' ? 0 : size * 1.6, target: null };
    try { e.target.releasePointerCapture(e.pointerId); } catch (x) {}
    moveDrag(e);
  }
  function moveDrag(e) {
    if (!drag) return;
    var pw = drag.dims.w * drag.size + (drag.dims.w - 1) * 3, ph = drag.dims.h * drag.size + (drag.dims.h - 1) * 3;
    var left = e.clientX - pw / 2, top = e.clientY - ph / 2 - drag.lift;
    drag.el.style.left = left + 'px'; drag.el.style.top = top + 'px';
    var rect = boardEl.getBoundingClientRect(), step = drag.size + 3;
    var fc = (left - rect.left - 6) / step, fr = (top - rect.top - 6) / step;
    var spot = nearest(drag.piece.cells, fr, fc), r = spot && spot[0], c = spot && spot[1];
    if (spot && (!drag.target || drag.target[0] !== r || drag.target[1] !== c)) {
      drag.target = [r, c];
      render(drag.piece.cells.map(function (k) { return (r + k[0]) * N + c + k[1]; }));
      hideSrc();
    } else if (!spot && drag.target) { drag.target = null; render(); hideSrc(); }
  }
  // أقرب مكان ينفع في حدود خانة ونص من مكان الصباع — الطفل ما يحتاجش دقة
  function nearest(cellsOf, fr, fc) {
    var best = null, bestD = 1.6 * 1.6;
    for (var r = Math.floor(fr) - 1; r <= Math.ceil(fr) + 1; r++) for (var c = Math.floor(fc) - 1; c <= Math.ceil(fc) + 1; c++) {
      var d = (r - fr) * (r - fr) + (c - fc) * (c - fc);
      if (d < bestD && L.canPlace(state.board, cellsOf, r, c)) { bestD = d; best = [r, c]; }
    }
    return best;
  }
  function hideSlot(t) { var m = slots[t].firstChild; if (m) m.style.visibility = 'hidden'; }
  function hideSrc() { hideSlot(drag.idx); }
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.remove();
    if (d.target) commit(d.idx, d.target[0], d.target[1], d.piece); else render();
  }
  window.addEventListener('pointermove', moveDrag, { passive: true });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function commit(idx, r, c, piece) {
    var pre = state.board.slice();
    piece.cells.forEach(function (k) { pre[(r + k[0]) * N + c + k[1]] = piece.color; });
    var res = L.place(state, idx, r, c);
    if (!res) { render(); return; }
    activity();
    if (state.score > best) { best = state.score; store('rass.best', String(best)); }
    save();
    render();
    piece.cells.forEach(function (k) { var i = (r + k[0]) * N + c + k[1]; if (state.board[i]) cells[i].classList.add('pop'); });
    if (res.lines) {
      sfx.clear(res.lines, res.combo);
      res.cleared.forEach(function (k) { cells[k].className = 'cell filled f' + pre[k] + ' clearing'; sparkle(cells[k]); });
      plus('+' + res.gained);
      if (res.praise) cheer(res.praise.word, res.praise.bonus ? ' +' + res.praise.bonus : '');
      if (res.leveledUp) setTimeout(function () { cheer(tr('levelUp') + res.level + '!', '', 'Level ' + res.level); plus(themeName(res.level)); sfx.levelUp(); }, 1250);
      if (state.combo >= 2) { var cb = $('combo'); cb.classList.remove('bump'); void cb.offsetWidth; cb.classList.add('bump'); }
      setTimeout(function () { render(); afterMove(); }, 330);
    } else { sfx.place(); afterMove(); }
  }
  function afterMove() {
    if (state.over) {
      $('finalScore').textContent = state.score;
      $('overUndo').style.display = state.undoUsed ? 'none' : '';
      $('finalBest').textContent = state.score >= best && state.score > 0 ? tr('bestYet') : tr('yourBest') + best;
      try { localStorage.removeItem('rass.game'); } catch (e) {}
      setTimeout(function () { sfx.end(); show('overO'); }, 350);
    }
  }

  function sparkle(cellEl) {
    var b = cellEl.getBoundingClientRect(), stars = ['✦', '★', '✧'];
    for (var i = 0; i < 2; i++) {
      var s = document.createElement('div');
      s.className = 'spark';
      s.textContent = stars[(Math.random() * 3) | 0];
      s.style.left = (b.left + b.width / 2 - 9) + 'px'; s.style.top = (b.top + b.height / 2 - 9) + 'px';
      var a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 50;
      s.style.setProperty('--dx', Math.cos(a) * dist + 'px'); s.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      document.body.appendChild(s);
      setTimeout(function (x) { return function () { x.remove(); }; }(s), 750);
    }
  }
  var CHEER_COLORS = { 'Nice!': 'var(--c4)', 'Good!': 'var(--c3)', 'Very good!': 'var(--c5)', 'Excellent!': 'var(--c1)', 'Amazing!': 'var(--c6)' };
  function cheer(word, extra, speakEn) {
    var shown = tr('praise')[word] || word;
    var b = boardEl.getBoundingClientRect(), el = document.createElement('div');
    el.className = 'praise'; el.textContent = shown + extra;
    el.style.top = (b.top + b.height * 0.32) + 'px';
    el.style.color = CHEER_COLORS[word] || 'var(--c2)';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1250);
    sfx.say(shown.replace('!', ''), lang, (speakEn || word).replace('!', ''));
  }
  function plus(text) {
    var b = boardEl.getBoundingClientRect(), el = document.createElement('div');
    el.className = 'plus'; el.textContent = text;
    el.style.left = (b.left + b.width / 2) + 'px'; el.style.top = (b.top + b.height / 2) + 'px';
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 950);
  }

  // لكل ليفل عالم بألوانه (بطلبه 2026-10-10 22:44 «Every level have a theme and colors differently»)
  var THEMES = [
    { bg: '#eef6e6', panel: '#d9ead0', cell: '#c9dfbd', ink: '#2f3b2a', soft: '#5f7457', accent: '#e0703f',
      c: ['#ef8a7a', '#f2c14e', '#7cc36a', '#6fb1d8', '#b28ddb', '#f29bc0'] },
    { bg: '#e3f1fb', panel: '#c6e1f3', cell: '#b0d3ec', ink: '#1d3448', soft: '#4e6d86', accent: '#ff8a3d',
      c: ['#ff8a65', '#ffd54f', '#4dd0b1', '#3d8fd9', '#7e7ce0', '#f78fb3'] },
    { bg: '#fbf0dc', panel: '#f1dcb6', cell: '#e8cd9d', ink: '#4a3420', soft: '#8a6a45', accent: '#c4552b',
      c: ['#d9653b', '#e9a23b', '#9bb04a', '#4f9aa8', '#a3708f', '#e07a8f'] },
    { bg: '#151a33', panel: '#222a4d', cell: '#2c3560', ink: '#eef0ff', soft: '#a9b0d8', accent: '#ffcf4a',
      c: ['#ff6b8b', '#ffcf4a', '#5ef0b0', '#5ab8ff', '#b78bff', '#ff9a4d'] },
    { bg: '#fdeaf3', panel: '#f7d3e4', cell: '#f0c0d7', ink: '#4a2338', soft: '#8c5674', accent: '#e0457b',
      c: ['#ff7aa8', '#ffc56b', '#8ee0a8', '#7fc4f2', '#c79bf2', '#ff9b7a'] },
    { bg: '#1f3326', panel: '#2b4533', cell: '#36533f', ink: '#eaf5e6', soft: '#a9c6a8', accent: '#f6b93b',
      c: ['#f07b5a', '#f6c445', '#9ad66a', '#5fb7c9', '#c39be0', '#f094b4'] },
    { bg: '#eaf4fb', panel: '#d3e6f3', cell: '#c0dcee', ink: '#1f3346', soft: '#56708a', accent: '#3a86d4',
      c: ['#f28fa0', '#ffd166', '#8fd3c1', '#6aa8e8', '#b9a7f0', '#ffffff'] },
    { bg: '#fff7e8', panel: '#fde7c4', cell: '#f8d9a8', ink: '#3d2d1a', soft: '#86684a', accent: '#e8505b',
      c: ['#e8505b', '#f9a03f', '#f6d743', '#4cb963', '#3a9ad9', '#8e6ccf'] },
    { bg: '#f3efe0', panel: '#e3dcc0', cell: '#d6cca8', ink: '#3a3320', soft: '#7a7050', accent: '#c0702a',
      c: ['#d9734e', '#e8b84a', '#8cb35a', '#6b9fbf', '#b58ab0', '#f2f2f2'] },
    { bg: '#101830', panel: '#1b2546', cell: '#253159', ink: '#f2f0ff', soft: '#a7aed6', accent: '#ffe08a',
      c: ['#ffe08a', '#ffb4a2', '#9ae6d0', '#8ec5ff', '#d3b6ff', '#fff6d6'] },
    { bg: '#fdf3ec', panel: '#f8ddcc', cell: '#f2ccb5', ink: '#43261b', soft: '#8a5d4a', accent: '#e2433f',
      c: ['#e2433f', '#ff9f43', '#ffd23f', '#6cc551', '#a259c4', '#ff7ab6'] },
    { bg: '#2a2219', panel: '#3a2f22', cell: '#4a3c2b', ink: '#f6ecdc', soft: '#c9b597', accent: '#ff7a3d',
      c: ['#ff7a3d', '#ffc94d', '#8fcf5a', '#59b3c4', '#c58be0', '#e8e0cf'] }
  ];
  var themeNow = 0;
  function applyTheme(level) {
    var i = (level - 1) % THEMES.length, t = THEMES[i];
    if (i === themeNow && document.documentElement.style.getPropertyValue('--bg')) return;
    themeNow = i;
    var st = document.documentElement.style;
    st.setProperty('--bg', t.bg); st.setProperty('--panel', t.panel); st.setProperty('--cell', t.cell);
    st.setProperty('--ink', t.ink); st.setProperty('--soft', t.soft); st.setProperty('--accent', t.accent);
    st.setProperty('--ghost', t.bg < '#8' ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.16)');
    t.c.forEach(function (col, k) { st.setProperty('--c' + (k + 1), col); });
    var meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', t.bg);
  }
  function themeName(level) { return tr('themes')[(level - 1) % THEMES.length]; }

  // الصوت: نغمات بتتعمل بالكود (من غير ملفات)، وله زرار يقفله ويفتحه
  var sfx = (function () {
    var ctx = null, on = store('rass.sound') !== 'off';
    function tone(freq, start, dur, vol, type) {
      if (!on || !ctx) return;
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + start;
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    var scale = [523, 587, 659, 784, 880, 1047, 1175, 1319];
    return {
      unlock: function () {
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} // آيفون: ما يتكتمش بزرار الصامت
        if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (!ctx) return;
        if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
        try { var b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0); } catch (e) {}
      },
      place: function () { tone(330, 0, 0.09, 0.18, 'triangle'); },
      clear: function (lines, combo) {
        var base = Math.min(combo - 1, 3);
        for (var i = 0; i < 2 + lines; i++) tone(scale[Math.min(base + i, scale.length - 1)], i * 0.07, 0.22, 0.16, 'triangle');
      },
      // بالعربي لو الجهاز فيه صوت عربي، وإلا بالإنجليزي
      say: function (text, lg, enText) {
        if (!on || !window.speechSynthesis) return;
        try {
          speechSynthesis.cancel();
          var hasAr = lg === 'ar' && speechSynthesis.getVoices().some(function (v) { return /^ar/i.test(v.lang); });
          var u = new SpeechSynthesisUtterance(lg === 'ar' && hasAr ? text : enText);
          u.lang = lg === 'ar' && hasAr ? 'ar' : 'en-US'; u.rate = 1; u.pitch = 1.3; u.volume = 1;
          speechSynthesis.speak(u);
        } catch (e) {}
      },
      levelUp: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.3, 0.16, 'triangle'); }); },
      end: function () { tone(392, 0, 0.4, 0.12); tone(330, 0.18, 0.5, 0.1); },
      toggle: function () { on = !on; store('rass.sound', on ? 'on' : 'off'); return on; },
      get on() { return on; }
    };
  })();
  // الموبايل ما بيسمحش بالصوت غير بعد ما الصباع يترفع — نفتحه هنا
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { sfx.unlock(); }, { passive: true, capture: true }); });
  $('langBtn').onclick = function () { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('rass.lang', lang); } catch (e) {} applyLang(); render(); };
  applyLang();
  $('soundBtn').textContent = sfx.on ? '🔊' : '🔇';
  $('soundBtn').onclick = function () { sfx.unlock(); $('soundBtn').textContent = sfx.toggle() ? '🔊' : '🔇'; };

  function show(id) { $(id).classList.add('show'); }
  function hide(id) { $(id).classList.remove('show'); }

  $('undo').onclick = function () { if (L.undo(state)) { hide('overO'); save(); render(); } };
  $('overUndo').onclick = function () { $('undo').onclick(); };
  var paused = false;
  $('pauseBtn').onclick = function () { paused = true; show('pauseO'); };
  $('resumeBtn').onclick = function () { paused = false; hide('pauseO'); };
  $('resetBtn').onclick = function () { show('resetO'); };
  $('resetNo').onclick = function () { hide('resetO'); };
  $('resetYes').onclick = function () { hide('resetO'); hide('overO'); newGame(); };
  $('againBtn').onclick = function () { hide('overO'); newGame(); };
  $('howBtn').onclick = function () { show('howO'); };
  $('howClose').onclick = function () { hide('howO'); };

  // كلمة الوقت: بعد ٢٠ دقيقة لعب فعلي (الصفحة ظاهرة وفي لمس خلال آخر دقيقتين) — مرة واحدة، من غير قفل
  var played = 0, lastTouch = 0, told = false;
  function activity() { lastTouch = Date.now(); }
  setInterval(function () {
    if (told || paused || document.hidden || Date.now() - lastTouch > 120000) return;
    played += 1;
    if (played >= 20 * 60) { told = true; show('timeO'); }
  }, 1000);
  $('contBtn').onclick = function () { hide('timeO'); };
  $('enoughBtn').onclick = function () { hide('timeO'); $('byeScore').textContent = state.score; show('byeO'); };
  $('byeClose').onclick = function () { hide('byeO'); };

  window.addEventListener('resize', function () { render(); });
  state = load() || L.newGame(Math.random);
  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  window.__rass = { get state() { return state; }, commit: commit, L: L };
})();
</script>
